# Cloudflare Workers — static site hosting.
#
# There is no Worker script here on purpose: the site is a static Astro build
# with no server-side code, so this only tells Cloudflare where the built files
# are. Cloudflare serves them straight from its edge and static asset requests
# are free.
#
# Cloudflare runs the build itself from the repo (Workers Builds → Git
# integration), so the build command lives in the dashboard, not here:
#   Build command:      npm run build
#   Deploy command:     npx wrangler deploy
#   Path / root dir:    /
#
# Add a `main = "worker/index.ts"` entry here if the site ever needs real
# server-side code (an API route, form handling); assets keep working alongside.

# Must match the Worker created in the Cloudflare dashboard, or `wrangler deploy`
# publishes to a different Worker than the one serving the site.
name = "spykeautomation-com"
compatibility_date = "2026-07-01"

[assets]
# Astro's build output. Directory-style URLs (/integrators/ → index.html) are
# resolved automatically.
directory = "./dist"
